<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RRK Explorer</title>
  <link rel="preload" href="/fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="RRK Explorer">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name" data-t="brand"></span>
    </a>
    <form class="global-search" role="search" id="global-search">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
    </form>
    <div class="topbar-status" id="status" aria-live="polite"></div>
    <div class="lang" role="group" id="lang">
      <button type="button" data-lang="fa" lang="fa">فا</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </header>
  <nav class="sidenav" id="nav"></nav>
  <main id="main" tabindex="-1"></main>
  <div class="toast" id="toast" role="alert" hidden></div>
  <dialog id="dialog"></dialog>
</body>
</html>
